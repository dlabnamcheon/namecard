<style>
/* Layout: 한 장짜리 세로 카드. 위에 로고 블록(로고의 계단형 테두리를 반복), 아래로 연락 버튼 → 주소 → 채널 링크 */
:root {
  --bg: #ECEBE7;
  --card: #FFFFFF;
  --ink: #1C1C1C;
  --muted: #6B6862;
  --line: #E2E0DA;
  --accent: #F26A1B;
  --accent-ink: #FFFFFF;
  --chip: #F5F4F0;
  --logo-filter: none;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-latin: "Space Grotesk", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --card: #1C1C1B; --ink: #F2F1ED; --muted: #A19E97;
    --line: #2E2D2B; --accent: #FF7A2E; --accent-ink: #1C1C1C; --chip: #262524;
    --logo-filter: invert(1); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --card: #1C1C1B; --ink: #F2F1ED; --muted: #A19E97;
  --line: #2E2D2B; --accent: #FF7A2E; --accent-ink: #1C1C1C; --chip: #262524;
  --logo-filter: invert(1); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.card {
  max-width: 420px; margin: 0 auto; background: var(--card);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(0,0,0,.35);
}
.head { padding: 36px 28px 26px; border-bottom: 1px solid var(--line); }
.logo { display: block; width: 168px; height: auto; filter: var(--logo-filter); }
.name { margin: 26px 0 2px; font-size: 26px; font-weight: 900; letter-spacing: -0.02em; text-wrap: balance; }
.tag { margin: 0; color: var(--muted); font-size: 14px; }
.tag b { color: var(--accent); font-weight: 700; }

.body { padding: 22px 20px 26px; display: grid; gap: 22px; }
.label { font-family: var(--f-latin); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 4px; }

.primary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 10px 12px; border-radius: 14px;
  font-weight: 700; font-size: 15px; text-decoration: none;
  background: var(--chip); color: var(--ink); border: 0; cursor: pointer; font-family: inherit;
}
.btn.main { background: var(--accent); color: var(--accent-ink); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:focus-visible, .row:focus-visible, .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.guide { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile {
  display: grid; gap: 10px; align-content: start; padding: 14px; min-width: 0;
  border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: inherit;
}
.tile .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--accent); background: var(--chip); }
.tile .ic svg { width: 18px; height: 18px; }
.tile .t { display: block; font-weight: 700; font-size: 15px; }
.tile .s { display: block; font-size: 12px; color: var(--muted); }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) { .tile:hover { background: var(--chip); } }

.list { display: grid; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  text-decoration: none; color: inherit; min-width: 0;
}
.row + .row { border-top: 1px solid var(--line); }
.row .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--chip); display: grid; place-items: center; flex: none; }
.row .ic svg { width: 17px; height: 17px; }
.row .txt { min-width: 0; flex: 1; }
.row .k { display: block; font-size: 12px; color: var(--muted); }
.row .v { display: block; font-weight: 500; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.copy {
  flex: none; font: 600 12px var(--f-body); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer;
}
.copy.done { color: var(--accent); border-color: var(--accent); }
.chev { flex: none; color: var(--muted); }

.save { width: 100%; background: var(--ink); color: var(--card); }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .row { transition: background-color .15s, transform .15s; }
  .btn:active { transform: scale(.98); }
}
@media (hover: hover) { a.row:hover { background: var(--chip); } }
</style>
