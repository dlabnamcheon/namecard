<style>
:root {
  --bg: #E9ECF2;
  --card: #FFFFFF;
  --ink: #1A1F2B;
  --muted: #646B78;
  --line: #E0E4EC;
  --accent: #1E3C8C;
  --accent-ink: #FFFFFF;
  --green: #5E9B32;
  --chip: #F2F4F8;
  --f-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-latin: "Space Grotesk", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1218; --card: #181C24; --ink: #EEF1F6; --muted: #9AA2B1;
    --line: #2A303B; --accent: #6E95F0; --accent-ink: #0F1218; --green: #8CC45E; --chip: #222833;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1218; --card: #181C24; --ink: #EEF1F6; --muted: #9AA2B1;
  --line: #2A303B; --accent: #6E95F0; --accent-ink: #0F1218; --green: #8CC45E; --chip: #222833;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg); color: var(--ink); font-family: var(--f-body);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
.card {
  max-width: 420px; margin: 0 auto; background: var(--card);
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 1px 0 var(--line), 0 18px 40px -24px rgba(0,0,0,.35);
}
.head {
  padding: 30px 28px 24px; border-bottom: 1px solid var(--line);
  border-top: 5px solid var(--green);
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
}
.who { min-width: 0; }
.org { margin: 0 0 18px; font-weight: 900; font-size: 17px; letter-spacing: -0.01em; color: var(--accent); }
.role { margin: 0; color: var(--muted); font-size: 14px; font-weight: 500; }
.name { margin: 2px 0 0; font-size: 30px; font-weight: 900; letter-spacing: .12em; }
.logo {
  flex: none; width: 76px; height: auto; display: block;
  background: #fff; border-radius: 12px; padding: 6px;
}

.body { padding: 22px 20px 26px; display: grid; gap: 22px; }
.label { font-family: var(--f-latin); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px 4px; }

.primary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 10px 12px; border-radius: 14px;
  font-weight: 700; font-size: 15px; text-decoration: none;
  background: var(--chip); color: var(--ink); border: 0; cursor: pointer; font-family: inherit;
}
.btn.main { background: var(--accent); color: var(--accent-ink); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:focus-visible, .row:focus-visible, .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.list { display: grid; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  text-decoration: none; color: inherit; min-width: 0;
}
.row + .row { border-top: 1px solid var(--line); }
.row .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--chip); color: var(--accent); display: grid; place-items: center; flex: none; }
.row .ic svg { width: 17px; height: 17px; }
.row .txt { min-width: 0; flex: 1; color: inherit; text-decoration: none; }
.row .k { display: block; font-size: 12px; color: var(--muted); }
.row .v { display: block; font-weight: 500; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.copy {
  flex: none; font: 600 12px var(--f-body); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; cursor: pointer;
}
.copy.done { color: var(--accent); border-color: var(--accent); }
.chev { flex: none; color: var(--muted); }


.notice {
  border-radius: 14px; padding: 16px 16px 16px 18px;
  background: var(--chip); border-left: 4px solid var(--green);
}
.notice p { margin: 0; word-break: keep-all; text-wrap: pretty; }
.notice .ask { font-weight: 700; font-size: 15px; }
.notice .ask b { color: var(--accent); }
.notice .law { margin-top: 8px; font-size: 12px; color: var(--muted); }

.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 18px; }
@media (prefers-reduced-motion: no-preference) {
  .btn, .row { transition: background-color .15s, transform .15s; }
  .btn:active { transform: scale(.98); }
}
@media (hover: hover) { a.row:hover { background: var(--chip); } }
